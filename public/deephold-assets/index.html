<style>
/* 갱도 벽에 표본을 붙여 둔 도감. 어두운 단일 테마, 강조색은 랜턴 주황 하나. */
:root {
  --bg: #121017; --panel: #1a1721; --panel-2: #211d2a; --stage: #0b0a0f; --line: #2b2735; --line-2: #3a3546;
  --fg: #ece6d9; --muted: #9d96a8; --faint: #6d677a;
  --accent: #ffb347; --accent-hi: #ffd780; --accent-ink: #1a1206; --danger: #ff6b5a;
  --r-c: #9a95a6; --r-r: #5fb8ad; --r-h: #b884ea; --r-l: #ffb347;
  --display: "Do Hyeon", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
  --body: "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --radius: 8px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--body); line-height: 1.55; overflow-x: hidden; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 1240px; margin: 0 auto; padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px)); }

.home { font-size: 13px; color: var(--muted); text-decoration: none; }
.home:hover { color: var(--accent); }
/* 머리 */
.top { padding-block: 40px 20px; display: grid; gap: 10px; }
.top h1 { font-family: var(--display); font-weight: 400; font-size: clamp(40px, 7vw, 72px); line-height: .95; margin: 0; }
.top h1 em { font-style: normal; color: var(--accent); text-shadow: 0 0 24px rgba(255,179,71,.35); }
.top p { margin: 0; color: var(--muted); max-width: 64ch; }
.stats { font-family: var(--mono); font-size: 12px; color: var(--faint); letter-spacing: .04em; }

/* 고정 메뉴 */
nav.tabs { position: sticky; top: 0; z-index: 20; background: rgba(18,16,23,.94); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }

nav.tabs button:hover { border-color: var(--accent); color: var(--accent); }
nav.tabs button[aria-current="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

/* 구역 */
main { padding-block: 24px 96px; min-height: 60vh; }
.sec-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; }

.sec-head .count { font-family: var(--mono); font-size: 12px; color: var(--accent); }

.group { margin-top: 28px; }

/* 서랍(카드에서 연 플레이어) */

.xbtn { background: var(--panel-2); border: 1px solid var(--line-2); border-radius: 999px; width: 32px; height: 32px; flex: none; }
@media (max-width: 640px) {
  .drawer { left: 0; right: 0; bottom: 0; width: auto; border-radius: 14px 14px 0 0; max-height: 78vh; padding-bottom: max(14px, env(safe-area-inset-bottom)); }
}

/* 보스 */
.boss { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-top: 18px; display: grid; gap: 14px; min-width: 0; }
.boss h3 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 26px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.boss h3 small { font-family: var(--body); font-size: 13px; color: var(--muted); }
.stills { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 4px; }
.stills figure { margin: 0; flex: none; background: var(--stage); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px; text-align: center; }
.stills img { image-rendering: pixelated; display: block; }
.stills figcaption { padding: 6px 0 0; font-size: 13px; color: var(--muted); }
.boss-body { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 980px) { .boss-body { grid-template-columns: auto minmax(0, 1fr); align-items: start; } }

/* 효과음 */
.toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; position: sticky; top: 55px; z-index: 5; background: var(--bg); padding: 10px 0; border-bottom: 1px solid var(--line); margin-bottom: 8px; }
.toolbar input[type=search] { flex: 1 1 220px; min-width: 0; background: var(--panel); border: 1px solid var(--line-2); border-radius: 999px; padding: 8px 14px; }

.toolbar label { font-size: 13px; color: var(--muted); display: flex; gap: 6px; align-items: center; }

.btn:hover { border-color: var(--accent); }
.cat { border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); margin-top: 10px; }
.cat > summary { cursor: pointer; padding: 12px 14px; display: flex; gap: 10px; align-items: baseline; list-style: none; flex-wrap: wrap; }
.cat > summary::-webkit-details-marker { display: none; }
.cat > summary h3 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 21px; }
.cat > summary::before { content: "▸"; color: var(--accent); display: inline-block; transition: transform .15s; }
.cat[open] > summary::before { transform: rotate(90deg); }
.cat .body { padding: 0 14px 14px; }
.sub { margin-top: 12px; }
.sub h4 { margin: 0 0 4px; font-weight: 400; font-family: var(--display); font-size: 16px; color: var(--accent-hi); display: flex; gap: 8px; align-items: baseline; }
.row { display: grid; grid-template-columns: 34px minmax(0, 13em) minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 5px 0; border-top: 1px solid var(--line); }
.row code { font-family: var(--mono); font-size: 12px; color: var(--fg); word-break: break-all; }
.row .d { font-size: 13px; color: var(--muted); }
.row .v { font-family: var(--mono); font-size: 11px; color: var(--faint); white-space: nowrap; }
.play { width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--line-2); background: var(--panel-2); display: grid; place-items: center; font-size: 12px; padding: 0; }
.play:hover { border-color: var(--accent); color: var(--accent); }
.play.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.play.wait { opacity: .6; }
.loopb { font-size: 10px; color: var(--r-r); border: 1px solid currentColor; border-radius: 999px; padding: 0 6px; margin-left: 6px; }
@media (max-width: 640px) { .row { grid-template-columns: 34px minmax(0, 1fr); } .row .d, .row .v { grid-column: 2; } }

/* 업적·칭호 */
.achrules { display: grid; gap: 6px 18px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); font-size: 13.5px; color: var(--muted); }
.achrules b { color: var(--fg); font-weight: 600; }
.achtool { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin: 14px 0 6px; }
.achtool input[type=search] { flex: 1 1 220px; min-width: 0; background: var(--panel); border: 1px solid var(--line-2); border-radius: 999px; padding: 8px 14px; }
.achtool input[type=search]:focus { border-color: var(--accent); outline: none; }
.achtool label { font-size: 13px; color: var(--muted); display: flex; gap: 6px; align-items: center; }
.achlist { display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 420px), 1fr)); }
.ach { display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: 4px 12px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; align-items: start; }
.ach .em { grid-row: span 3; width: 76px; height: 76px; display: grid; place-items: center; background: var(--stage); border-radius: 6px; }
.ach canvas { image-rendering: pixelated; image-rendering: crisp-edges; display: block; max-width: 100%; }
.ach .hd { display: flex; gap: 6px; align-items: baseline; flex-wrap: wrap; }
.ach .hd b { font-size: 15px; font-weight: 600; }
.ach .hd code { font-family: var(--mono); font-size: 11px; color: var(--faint); }
.ach .pt { font-size: 11px; padding: 0 7px; border-radius: 999px; border: 1px solid currentColor; line-height: 17px; }
.ach .pt.t1 { color: #a9a5c0; } .ach .pt.t2 { color: #7fd0bf; } .ach .pt.t3 { color: #d7b8ee; } .ach .pt.t4 { color: #ffd780; }
.ach .hid { font-size: 11px; color: #ffb0a0; border: 1px solid currentColor; border-radius: 999px; padding: 0 7px; line-height: 17px; }
.ach .cond { font-size: 13.5px; color: var(--fg); }
.ach .plate { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 12px; color: var(--muted); min-width: 0; }

.ach .ex { grid-column: 1 / -1; font-size: 12px; color: var(--faint); display: flex; gap: 4px 12px; flex-wrap: wrap; border-top: 1px dashed var(--line-2); padding-top: 5px; margin-top: 2px; }
.ach .ex .rw { color: var(--accent); }
.achcat { margin-top: 18px; }
.achcat h3 { font-family: var(--display); font-weight: 400; font-size: 21px; margin: 0 0 8px; display: flex; gap: 8px; align-items: center; }

.tracks { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); }

.chips { display: flex; gap: 6px; flex-wrap: wrap; }

nav.tabs button .newb { margin-left: 6px; }

.card.wfull .stage img { max-width: 100%; height: auto; }
.bossmus .tracks { grid-template-columns: repeat(auto-fill, minmax(min(100%, 280px), 1fr)); }
</style>
</head>
<body>

<header class="wrap top">
  <a class="home" href="/ko/trials/deephold/">← 딥홀드 시행착오 · qminlab.com</a>
  <h1>딥홀드 <em>에셋</em></h1>
  <p>2.5D(3/4 탑다운) 도트 시안과 사운드 전부. 빛은 왼쪽 위에서 오고, 화면에서 따뜻한 색은 도굴꾼의 랜턴과 불빛뿐이다. 카드에 <span style="color:var(--accent)">▶ 동작</span> 표시가 있으면 눌러서 애니메이션을 돌려 볼 수 있다.</p>
  <div class="stats">정지 그림 약 1,180 · 애니메이션 시트 307 · 효과음 803 · 음악 34 · 구역을 열 때 그 구역 데이터만 불러온다</div>
</header>
<nav class="tabs" aria-label="구역"><div class="wrap" id="tabs"></div></nav>
<main class="wrap" id="main"></main>
<aside class="drawer" id="drawer" aria-label="애니메이션 플레이어">
  <header><h4 id="dtitle"></h4><button class="xbtn" id="dclose" aria-label="닫기">✕</button></header>
  <div id="dhost"></div>
</aside>

<script>
(() => {
'use strict';
const $ = (s, r = document) => r.querySelector(s);
const el = (tag, attrs, ...kids) => {
  const e = document.createElement(tag);
  if (attrs) for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k === 'text') e.textContent = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) e.append(c.nodeType ? c : String(c));
  return e;
};
const store = {
  get(k) { try { return localStorage.getItem('deephold-gallery:' + k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem('deephold-gallery:' + k, v); } catch (e) {} },
};
const RANK = { c: '일반', r: '희귀', h: '영웅', l: '전설' };
const scaleFor = (w, h) => { const m = Math.max(w, h); return m <= 16 ? 6 : m <= 32 ? 4 : m <= 48 ? 3 : m <= 64 ? 3 : m <= 128 ? 2 : 1; };
const mb = b => (b / 1e6).toFixed(1) + ' MB';

/* ---------- 데이터 불러오기 (구역을 열 때만, 한 번만) ---------- */
const packs = new Map();
function loadPack(name, onProgress) {
  if (packs.has(name)) return packs.get(name);

  } catch (e) {
    st.className = 'status err'; st.textContent = '불러오지 못했다: ' + (e && e.message || e) + ' ';
    st.append(el('button', { class: 'btn', onclick: () => { hosts.delete(s.id); h.remove(); current = null; show(s.id); } }, '다시 시도'));
  }
}
const seenV5 = store.get('seen') === 'v15'; store.set('seen', 'v15');
const initial = (location.hash || '').slice(1) || (seenV5 ? store.get('tab') : 'changes') || 'changes';
show(SECTIONS.some(s => s.id === initial) ? initial : 'changes');
window.addEventListener('hashchange', () => { const id = location.hash.slice(1); if (SECTIONS.some(s => s.id === id)) show(id, true); });
})();
</script>
