<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0f1226">
<link rel="icon" href="/icon.svg">
<title>라이트 길드 관리자</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&display=swap">
<link rel="stylesheet" href="../guild.css">
<style>
  .gate { max-width: 420px; margin: 24px auto 0; }
  .tabs { margin-bottom: 20px; }
  .daybar { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 8px; align-items: center; }
  .daynote { margin: 10px 0 0; font-weight: 600; color: var(--text-soft); }
  .picker-tools { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 8px; margin-top: 14px; }
  .checks { list-style: none; margin: 12px 0 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; }
  /* One toggle per member: an outline when absent, lit when present. */
  .check {
    width: 100%; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 9px; align-items: center; text-align: left;
    border: 1px solid var(--line); background: transparent; color: var(--text-soft); border-radius: var(--radius); padding: 5px 10px 5px 6px; min-height: 50px; font-weight: 600;
  }
  .check span.nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .check .face { width: 36px; height: 36px; opacity: 0.55; }
  .check[aria-pressed="true"] { background: var(--light-dim); border-color: var(--light); color: var(--light); }
  .check[aria-pressed="true"] .face { opacity: 1; }
  .savebar {
    position: sticky; bottom: 0; z-index: 5; margin: 20px -16px -32px; padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    background: #0b0d1e; border-top: 1px solid var(--line-strong);
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
  }
  .savebar b { font-family: var(--serif); font-size: 1.1rem; }
  .days { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .days button { border: 1px solid var(--line-strong); background: transparent; color: var(--text-soft); border-radius: var(--radius); padding: 5px 11px; font-weight: 600; font-size: 0.86rem; min-height: 38px; }
  .days button[aria-pressed="true"] { border-color: var(--light); color: var(--light); background: var(--light-dim); }

  .req { background: var(--bg-2); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 14px; margin-top: 10px; }
  .req .pics { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; align-items: start; }
  .req .pics figure { margin: 0; background: #0b0d1e; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; text-align: center; }
  .req .pics img { display: block; margin: 0 auto; max-height: 320px; max-width: 100%; }
  .req .pics figure.new { background: radial-gradient(ellipse 75% 62% at 50% 0, rgba(150, 160, 240, 0.3), rgba(150, 160, 240, 0) 72%), #121530; padding: 10px; }
  .req figcaption { font-size: 0.78rem; color: var(--text-mute); padding: 5px; border-top: 1px solid var(--line); }
  .grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 10px; }
  .grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .acts-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
  .acts-row .btn { flex: 1 1 120px; }

  .roster { list-style: none; margin: 12px 0 0; padding: 0; border-top: 1px solid var(--line-strong); }
  .roster li { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 9px 4px; border-bottom: 1px solid var(--line); }
  .roster li.off { opacity: 0.5; }
  .roster b { display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .newpic { margin-top: 10px; border: 1px solid var(--line); border-radius: var(--radius); padding: 10px; text-align: center; }
  .newpic canvas { max-width: 100%; max-height: 220px; cursor: crosshair; }
</style>
</head>
<body>
<div class="shell">
  <header class="top">
    <h1><a href="../"><span class="mark" aria-hidden="true"></span>라이트 <small>길드</small></a></h1><span class="sub">관리자</span>
    <nav class="menu side" style="display:flex" aria-label="메뉴">
      <a href="../">길드 사이트로</a>
      <button type="button" id="logout" hidden>로그아웃</button>
    </nav>
  </header>

  <main>
    <div class="pane wide">
      <p class="loading" id="loading">불러오는 중…</p>
      <div class="alert" id="alert" hidden><b id="alert-title"></b><span id="alert-text"></span></div>

      <!-- 처음 한 번: 비밀번호 만들기 -->
      <form class="gate card" id="setup" hidden autocomplete="off">
        <h2>관리자 비밀번호 만들기</h2>
        <p class="hint" style="margin-top:0">처음 한 번만 정해요. 이 비밀번호를 아는 사람만 레이드 참석을 입력할 수 있어요. 8자 이상.</p>
        <label class="lbl" for="pw1">비밀번호</label>
        <input class="field" id="pw1" type="password" minlength="8" autocomplete="new-password" required>
        <label class="lbl" for="pw2">한 번 더</label>
        <input class="field" id="pw2" type="password" minlength="8" autocomplete="new-password" required>
        <p class="hint" id="setup-msg" style="color:var(--bad);min-height:1.3em"></p>
        <button class="btn" type="submit" style="width:100%">만들기</button>
      </form>

      <form class="gate card" id="login" hidden>
        <h2>관리자 로그인</h2>
        <label class="lbl" for="pw">비밀번호</label>
        <input class="field" id="pw" type="password" autocomplete="current-password" required>
        <p class="hint" id="login-msg" style="color:var(--bad);min-height:1.3em"></p>
        <button class="btn" type="submit" style="width:100%">들어가기</button>
      </form>

      <div id="app" hidden>
        <div class="seg tabs" role="group" aria-label="관리 화면">
          <button type="button" data-tab="raid" aria-pressed="true">참석 입력</button>
          <button type="button" data-tab="pending" aria-pressed="false" id="tab-pending">갱신 대기</button>
          <button type="button" data-tab="roster" aria-pressed="false">길드원</button>
        </div>

        <!-- 참석 입력 -->
        <section id="tab-raid">
          <h2><label for="date">레이드 날짜</label> <small>매일 오후 8시 레이드</small></h2>
          <div class="daybar">
            <input class="field" id="date" type="date">
            <button type="button" class="btn ghost small" id="today">오늘</button>
            <button type="button" class="btn ghost small" id="yesterday">어제</button>
          </div>
          <p class="daynote" id="daynote"></p>

          <div class="picker-tools">
            <input class="field" id="find" type="search" placeholder="닉네임 찾기" autocomplete="off" aria-label="닉네임 찾기">
            <button type="button" class="btn ghost small" id="all">모두 선택</button>
            <button type="button" class="btn ghost small" id="none">모두 해제</button>
          </div>
          <ul class="checks" id="checks"></ul>

          <h2>저장된 날짜 <small>누르면 그 날짜를 불러와요</small></h2>
          <div class="days" id="days"></div>
          <p style="margin-top:14px"><button type="button" class="btn danger small" id="wipe" hidden>이 날짜 기록 지우기</button></p>

          <div class="savebar">
            <b id="picked">0명 참석</b>
            <button type="button" class="btn" id="save">저장</button>
          </div>
        </section>

        <!-- 갱신 대기 -->
        <section id="tab-pending-body" hidden>
          <p class="hint" style="margin-top:0">길드원이 올린 캡처 중 자동으로 확인하지 못한 것들이에요. 캡처를 보고 값을 맞춘 뒤 승인하면 반영돼요.</p>
          <div id="reqs"></div>
        </section>

        <!-- 길드원 -->
        <section id="tab-roster-body" hidden>
          <div class="acts-row" style="margin-top:0"><button type="button" class="btn small" id="add">길드원 추가</button></div>
          <ul class="roster" id="roster"></ul>
        </section>
      </div>
    </div>
  </main>
</div>

<div class="modal" id="edit" hidden role="dialog" aria-modal="true" aria-labelledby="edit-title">
  <form class="sheet" id="edit-form" autocomplete="off">
    <header id="edit-title">길드원</header>
    <div class="body">
      <label class="lbl" for="e-nick" style="margin-top:0">닉네임</label>
      <input class="field" id="e-nick" maxlength="24" required>
      <div class="grid3">
        <div><label class="lbl" for="e-cls">직업</label>
          <select class="field" id="e-cls"><option value="">미상</option><option>투사</option><option>주술사</option><option>기사</option><option>현자</option></select></div>
        <div><label class="lbl" for="e-level">레벨</label><input class="field" id="e-level" inputmode="numeric"></div>
        <div><label class="lbl" for="e-power">전투력</label><input class="field" id="e-power" placeholder="631K"></div>
      </div>
      <label class="lbl" for="e-active">상태</label>
      <select class="field" id="e-active"><option value="1">길드원</option><option value="0">탈퇴 (랭킹에서 숨김, 기록은 남김)</option></select>
      <label class="lbl">캐릭터 그림</label>
      <input type="file" id="e-file" accept="image/*" hidden>
      <button type="button" class="btn ghost small" id="e-pick">캡처에서 새 그림 만들기</button>
      <p class="hint">유저 정보 창 캡처나 캐릭터 화면 캡처를 고르면 캐릭터만 오려내요. 얼굴 위치는 그림을 눌러 맞춰요.</p>
      <div class="newpic lit" id="e-newpic" hidden><canvas id="e-canvas"></canvas></div>
      <p class="hint" id="e-msg" style="color:var(--bad);min-height:1.3em"></p>
      <div class="acts">
        <button type="button" class="btn ghost" id="e-cancel">취소</button>
        <button type="submit" class="btn" id="e-save">저장</button>
      </div>
    </div>
  </form>
</div>

<div class="modal" id="confirm" hidden role="dialog" aria-modal="true">
  <div class="sheet"><header id="confirm-title"></header>
    <div class="body"><p id="confirm-text" style="margin:0"></p>
      <div class="acts"><button type="button" class="btn ghost" id="confirm-no">취소</button><button type="button" class="btn danger" id="confirm-yes">지우기</button></div></div></div>
</div>
<div class="toast" id="toast" hidden role="status"></div>

<script src="../cutout.js"></script>
<script>
(function () {
  'use strict';
  var API = '/api/guild';
  var $ = function (id) { return document.getElementById(id); };
  var members = [], present = {}, loadedDate = '', dirty = false, days = [], editing = null, newPic = null;

  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function api(path, opt) {
    opt = opt || {};
    var init = { method: opt.method || 'GET', headers: { Accept: 'application/json' }, cache: 'no-store', credentials: 'same-origin' };
    if (opt.json) { init.headers['Content-Type'] = 'application/json'; init.body = JSON.stringify(opt.json); }
    if (opt.form) init.body = opt.form;
    return fetch(API + path, init).then(function (r) { return r.json().then(function (j) { return { status: r.status, ok: r.ok, body: j }; }); });
  }
  function kstToday(offsetDays) { return new Date(Date.now() + 9 * 3600000 - (offsetDays || 0) * 86400000).toISOString().slice(0, 10); }
  function power(n) { if (n == null) return ''; return n >= 1e6 ? (n / 1e6).toFixed(2).replace(/\.?0+$/, '') + 'M' : n >= 1e3 ? Math.round(n / 1e3) + 'K' : String(n); }
  function dateLabel(d) { var p = d.split('-'), dt = new Date(Date.UTC(+p[0], +p[1] - 1, +p[2])); return (+p[1]) + '/' + (+p[2]) + '(' + '일월화수목금토'[dt.getUTCDay()] + ')'; }
  function faceEl(m) { var f = el('span', 'face'), img = new Image(); img.alt = ''; img.loading = 'lazy'; img.src = m.face; img.onerror = function () { img.remove(); }; f.appendChild(img); return f; }
  var toastTimer = 0;
  function toast(t) { var e = $('toast'); e.textContent = t; e.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(function () { e.hidden = true; }, 3000); }

  // ───── 들어가기 ─────
  function boot() {
    api('/admin/status').then(function (r) {
      $('loading').hidden = true;
      if (!r.ok) {
        $('alert-title').textContent = r.body.error === 'no_database' ? '저장 공간이 아직 연결되지 않았어요' : '불러오지 못했어요';
        $('alert-text').textContent = r.body.error === 'no_database' ? 'Cloudflare에서 GUILD_DB 연결을 마친 뒤 다시 열어 주세요.' : '잠시 뒤에 다시 시도해 주세요.';
        $('alert').hidden = false; return;
      }
      $('setup').hidden = r.body.hasPassword;
      $('login').hidden = !r.body.hasPassword || r.body.loggedIn;
      $('app').hidden = !r.body.loggedIn; $('logout').hidden = !r.body.loggedIn;
      if (r.body.loggedIn) start();
      else if (r.body.hasPassword) $('pw').focus();
    }).catch(function () { $('loading').textContent = '연결하지 못했어요. 새로 고침해 주세요.'; });
  }
  $('setup').addEventListener('submit', function (e) {
    e.preventDefault();
    var a = $('pw1').value, b = $('pw2').value;
    if (a.length < 8) { $('setup-msg').textContent = '8자 이상으로 정해 주세요.'; return; }
    if (a !== b) { $('setup-msg').textContent = '두 칸의 비밀번호가 달라요.'; return; }
    api('/admin/setup', { method: 'POST', json: { password: a } }).then(function (r) {
      if (r.ok) { $('pw1').value = $('pw2').value = ''; boot(); }
      else $('setup-msg').textContent = r.body.error === 'already_set' ? '이미 비밀번호가 만들어져 있어요. 새로 고침해서 로그인해 주세요.' : '만들지 못했어요. 다시 시도해 주세요.';
    });
  });
  $('login').addEventListener('submit', function (e) {
    e.preventDefault();
    api('/admin/login', { method: 'POST', json: { password: $('pw').value } }).then(function (r) {
      if (r.ok) { $('pw').value = ''; boot(); }
      else $('login-msg').textContent = r.body.error === 'locked' ? '여러 번 틀려서 10분 동안 잠겼어요.' : '비밀번호가 맞지 않아요.';
    });
  });
  $('logout').addEventListener('click', function () { api('/admin/logout', { method: 'POST' }).then(function () { location.reload(); }); });

  function start() {
    $('date').max = kstToday(); $('date').value = kstToday();
    return api('/admin/roster').then(function (r) {
      members = r.body.members || [];
      buildChecks(); renderRoster();
      return Promise.all([loadDay($('date').value), loadDays(), loadPending()]);
    });
  }

  // ───── 화면 전환 ─────
  var tabs = document.querySelectorAll('[data-tab]');
  for (var t = 0; t < tabs.length; t++) tabs[t].addEventListener('click', function (e) {
    var name = e.currentTarget.dataset.tab;
    for (var j = 0; j < tabs.length; j++) tabs[j].setAttribute('aria-pressed', String(tabs[j] === e.currentTarget));
    $('tab-raid').hidden = name !== 'raid'; $('tab-pending-body').hidden = name !== 'pending'; $('tab-roster-body').hidden = name !== 'roster';
    if (name === 'pending') loadPending();
  });

  // ───── 참석 입력 ─────
  function active() { return members.filter(function (m) { return m.active; }).sort(function (a, b) { return a.nickname.localeCompare(b.nickname, 'ko'); }); }
  function buildChecks() {
    var ul = $('checks'); ul.textContent = '';
    active().forEach(function (m) {
      var li = el('li'), b = el('button', 'check'); b.type = 'button'; b.dataset.uid = m.uid; b.dataset.name = m.nickname.toLowerCase();
      b.setAttribute('aria-pressed', String(!!present[m.uid]));
      b.appendChild(faceEl(m)); b.appendChild(el('span', 'nm', m.nickname));
      li.appendChild(b); ul.appendChild(li);
    });
    filterChecks(); count();
  }
  $('checks').addEventListener('click', function (e) {
    var b = e.target.closest('.check'); if (!b) return;
    var on = b.getAttribute('aria-pressed') !== 'true';
    b.setAttribute('aria-pressed', String(on));
    if (on) present[b.dataset.uid] = 1; else delete present[b.dataset.uid];
    dirty = true; count();
  });
  function filterChecks() {
    var q = $('find').value.trim().toLowerCase(), items = $('checks').children;
    for (var i = 0; i < items.length; i++) items[i].hidden = !!q && items[i].firstChild.dataset.name.indexOf(q) < 0;
  }
  $('find').addEventListener('input', filterChecks);
  function setAll(on) {
    var items = $('checks').children;
    for (var i = 0; i < items.length; i++) {
      if (items[i].hidden) continue;                      // 찾기로 걸러진 사람만 바꾼다
      var b = items[i].firstChild; b.setAttribute('aria-pressed', String(on));
      if (on) present[b.dataset.uid] = 1; else delete present[b.dataset.uid];
    }
    dirty = true; count();
  }
  $('all').addEventListener('click', function () { setAll(true); });
  $('none').addEventListener('click', function () { setAll(false); });
  function count() {
    var n = Object.keys(present).length;
    $('picked').textContent = n + '명 참석' + (dirty ? ' · 저장 안 됨' : '');
  }
  function loadDay(date) {
    return api('/admin/day?date=' + date).then(function (r) {
      if (!r.ok) return;
      loadedDate = date; present = {}; dirty = false;
      r.body.present.forEach(function (u) { present[u] = 1; });
      var items = $('checks').children;
      for (var i = 0; i < items.length; i++) items[i].firstChild.setAttribute('aria-pressed', String(!!present[items[i].firstChild.dataset.uid]));
      $('daynote').textContent = dateLabel(date) + ' — ' + (r.body.saved ? '저장된 기록이 있어요 (' + r.body.present.length + '명). 고쳐서 다시 저장할 수 있어요.' : '아직 기록이 없어요. 참여한 길드원을 눌러 고르세요.');
      $('wipe').hidden = !r.body.saved;
      count(); markDay();
    });
  }
  function loadDays() {
    return api('/admin/days').then(function (r) { days = r.body.days || []; renderDays(); });
  }
  function renderDays() {
    var box = $('days'); box.textContent = '';
    if (!days.length) { box.appendChild(el('span', 'hint', '아직 저장된 날짜가 없어요.')); return; }
    days.forEach(function (d) {
      var b = el('button', '', dateLabel(d.date) + ' ' + d.n + '명'); b.type = 'button'; b.dataset.date = d.date;
      b.addEventListener('click', function () { pickDate(d.date); });
      box.appendChild(b);
    });
    markDay();
  }
  function markDay() { var bs = $('days').children; for (var i = 0; i < bs.length; i++) if (bs[i].dataset) bs[i].setAttribute('aria-pressed', String(bs[i].dataset.date === loadedDate)); }
  function pickDate(date) {
    if (!date) return;
    if (dirty && date !== loadedDate) toast(dateLabel(loadedDate) + ' 입력은 저장하지 않고 넘어왔어요');
    $('date').value = date; loadDay(date); window.scrollTo(0, 0);
  }
  $('date').addEventListener('change', function (e) { if (e.target.value) pickDate(e.target.value); });
  $('today').addEventListener('click', function () { pickDate(kstToday()); });
  $('yesterday').addEventListener('click', function () { pickDate(kstToday(1)); });
  $('save').addEventListener('click', function () {
    var date = $('date').value; if (!date) return;
    $('save').disabled = true;
    api('/admin/day', { method: 'PUT', json: { date: date, present: Object.keys(present) } }).then(function (r) {
      $('save').disabled = false;
      if (!r.ok) { toast(r.body.error === 'bad_date' ? '오늘 이후 날짜는 저장할 수 없어요' : r.status === 401 ? '로그인이 풀렸어요. 새로 고침해 주세요' : '저장하지 못했어요'); return; }
      toast(dateLabel(date) + ' ' + r.body.present.length + '명 저장했어요');
      loadDay(date); loadDays();
    }).catch(function () { $('save').disabled = false; toast('연결이 끊겼어요. 다시 눌러 주세요'); });
  });
  $('wipe').addEventListener('click', function () {
    ask(dateLabel(loadedDate) + ' 기록 지우기', '이 날짜의 참석 기록을 모두 지워요. 되돌릴 수 없어요.', function () {
      api('/admin/day?date=' + loadedDate, { method: 'DELETE' }).then(function () { toast('지웠어요'); loadDay(loadedDate); loadDays(); });
    });
  });
  var onYes = null;
  function ask(title, text, yes) { $('confirm-title').textContent = title; $('confirm-text').textContent = text; onYes = yes; $('confirm').hidden = false; $('confirm-no').focus(); }
  $('confirm-no').addEventListener('click', function () { $('confirm').hidden = true; });
  $('confirm-yes').addEventListener('click', function () { $('confirm').hidden = true; if (onYes) onYes(); });

  // ───── 갱신 대기 ─────
  var WHY = { older: '저장된 값보다 낮게 읽힘 (본인이 확인 요청)', unreadable: '닉네임을 읽지 못함', partial: '레벨·전투력을 다 읽지 못함', no_ai: '자동 읽기가 연결되지 않음', ai_failed: '자동 읽기 실패' };
  function loadPending() {
    return api('/admin/pending').then(function (r) {
      var list = r.body.pending || [], box = $('reqs'); box.textContent = '';
      $('tab-pending').textContent = '갱신 대기' + (list.length ? ' ' + list.length : '');
      if (!list.length) { box.appendChild(el('p', 'loading', '기다리는 요청이 없어요.')); return; }
      list.forEach(function (q) {
        var card = el('div', 'req');
        card.appendChild(el('b', '', q.nickname)); card.appendChild(el('p', 'hint', (WHY[q.reason] || q.reason || '') + ' · 저장된 값: 레벨 ' + (q.onFile.level || '–') + ', 전투력 ' + (power(q.onFile.power) || '–')));
        var pics = el('div', 'pics');
        [['shot', '올린 캡처'], ['char', '새 캐릭터 그림']].forEach(function (k) {
          var fig = el('figure', k[0] === 'char' ? 'new' : ''), img = new Image(); img.alt = k[1]; img.src = API + '/admin/pending/' + q.id + '/' + k[0];
          fig.appendChild(img); fig.appendChild(el('figcaption', '', k[1])); pics.appendChild(fig);
        });
        card.appendChild(pics);
        var g = el('div', 'grid3');
        var lv = el('input', 'field'); lv.inputMode = 'numeric'; lv.placeholder = '레벨'; lv.value = q.read.level != null ? q.read.level : ''; lv.setAttribute('aria-label', '레벨');
        var pw = el('input', 'field'); pw.placeholder = '전투력 (631K)'; pw.value = q.read.power != null ? power(q.read.power) : ''; pw.setAttribute('aria-label', '전투력');
        var cs = el('select', 'field'); cs.setAttribute('aria-label', '직업');
        ['', '투사', '주술사', '기사', '현자'].forEach(function (c) { var o = el('option', '', c || '직업 그대로'); o.value = c; cs.appendChild(o); });
        cs.value = q.read.cls || '';
        g.appendChild(lv); g.appendChild(pw); g.appendChild(cs); card.appendChild(g);
        var acts = el('div', 'acts-row'), no = el('button', 'btn danger small', '거절'), yes = el('button', 'btn small', '승인');
        no.type = yes.type = 'button';
        function decide(action) {
          no.disabled = yes.disabled = true;
          api('/admin/pending/' + q.id, { method: 'POST', json: { action: action, level: lv.value, power: pw.value, cls: cs.value } }).then(function (r2) {
            toast(r2.ok ? (action === 'approve' ? q.nickname + ' 갱신을 반영했어요' : '거절했어요') : '처리하지 못했어요');
            loadPending(); if (r2.ok && action === 'approve') api('/admin/roster').then(function (r3) { members = r3.body.members; buildChecks(); renderRoster(); });
          });
        }
        no.addEventListener('click', function () { decide('reject'); }); yes.addEventListener('click', function () { decide('approve'); });
        acts.appendChild(no); acts.appendChild(yes); card.appendChild(acts);
        box.appendChild(card);
      });
    });
  }

  // ───── 길드원 ─────
  function renderRoster() {
    var ul = $('roster'); ul.textContent = '';
    members.slice().sort(function (a, b) { return (b.active - a.active) || a.nickname.localeCompare(b.nickname, 'ko'); }).forEach(function (m) {
      var li = el('li', m.active ? '' : 'off'); li.appendChild(faceEl(m));
      var mid = el('div'); mid.appendChild(el('b', '', m.nickname + (m.active ? '' : ' (탈퇴)')));
      var c = el('span', 'cls', (m.cls || '직업 미상') + ' · Lv.' + (m.level || '–') + ' · ' + (power(m.power) || '–')); c.dataset.cls = m.cls || ''; mid.appendChild(c);
      li.appendChild(mid);
      var b = el('button', 'btn ghost small', '수정'); b.type = 'button'; b.addEventListener('click', function () { openEdit(m); });
      li.appendChild(b); ul.appendChild(li);
    });
  }
  function openEdit(m) {
    editing = m; newPic = null;
    $('edit-title').textContent = m ? m.nickname + ' 수정' : '길드원 추가';
    $('e-nick').value = m ? m.nickname : ''; $('e-cls').value = m ? m.cls || '' : ''; $('e-level').value = m ? m.level || '' : ''; $('e-power').value = m ? power(m.power) : '';
    $('e-active').value = m && !m.active ? '0' : '1'; $('e-active').disabled = !m;
    $('e-newpic').hidden = true; $('e-file').value = ''; $('e-msg').textContent = '';
    $('edit').hidden = false; $('e-nick').focus();
  }
  $('add').addEventListener('click', function () { openEdit(null); });
  $('e-cancel').addEventListener('click', function () { $('edit').hidden = true; });
  $('e-pick').addEventListener('click', function () { $('e-file').click(); });
  $('e-file').addEventListener('change', function (e) {
    var f = e.target.files && e.target.files[0]; if (!f) return;
    var url = URL.createObjectURL(f), img = new Image();
    img.onload = function () {
      URL.revokeObjectURL(url);
      var cut = null; try { cut = GuildCutout.cut(img, 'auto'); } catch (err) {}
      if (!cut) { $('e-msg').textContent = '캐릭터를 찾지 못했어요. 다른 캡처로 해 보세요.'; return; }
      newPic = cut; drawNew(); $('e-newpic').hidden = false; $('e-msg').textContent = '';
    };
    img.src = url;
  });
  function drawNew() {
    var cv = $('e-canvas'); cv.width = newPic.canvas.width; cv.height = newPic.canvas.height;
    var ctx = cv.getContext('2d'); ctx.drawImage(newPic.canvas, 0, 0);
    ctx.lineWidth = Math.max(2, cv.width / 120); ctx.strokeStyle = '#fff'; ctx.setLineDash([6, 4]);
    ctx.beginPath(); ctx.arc(newPic.face.x, newPic.face.y, newPic.face.r, 0, Math.PI * 2); ctx.stroke();
  }
  $('e-canvas').addEventListener('click', function (e) {
    if (!newPic) return; var r = e.currentTarget.getBoundingClientRect();
    newPic.face.x = Math.round((e.clientX - r.left) * newPic.canvas.width / r.width); newPic.face.y = Math.round((e.clientY - r.top) * newPic.canvas.height / r.height); drawNew();
  });
  $('edit-form').addEventListener('submit', function (e) {
    e.preventDefault();
    var body = { nickname: $('e-nick').value.trim(), cls: $('e-cls').value, level: $('e-level').value, power: $('e-power').value };
    if (editing) { body.uid = editing.uid; body.active = $('e-active').value === '1'; }
    $('e-save').disabled = true;
    api('/admin/member', { method: 'POST', json: body }).then(function (r) {
      if (!r.ok) { $('e-save').disabled = false; $('e-msg').textContent = r.body.error === 'nickname_taken' ? '이미 있는 닉네임이에요.' : '저장하지 못했어요.'; return null; }
      if (!newPic) return r;
      var C = GuildCutout;
      return Promise.all([C.pictureBlob(newPic.canvas), C.pictureBlob(C.faceCanvas(newPic.canvas, newPic.face, 120))]).then(function (b) {
        var fd = new FormData(); fd.append('uid', r.body.uid); fd.append('as_admin', '1'); fd.append('char', b[0], 'char'); fd.append('face', b[1], 'face');
        return api('/update', { method: 'POST', form: fd });
      });
    }).then(function (r) {
      $('e-save').disabled = false;
      if (!r) return;
      if (!r.ok) { $('e-msg').textContent = '정보는 저장했지만 그림을 올리지 못했어요.'; return; }
      $('edit').hidden = true; toast('저장했어요');
      api('/admin/roster').then(function (r2) { members = r2.body.members; buildChecks(); renderRoster(); });
    });
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') { $('edit').hidden = true; $('confirm').hidden = true; } });
  window.addEventListener('beforeunload', function (e) { if (dirty) { e.preventDefault(); e.returnValue = ''; } });

  boot();
})();
</script>
</body>
</html>
